name: Release Desktop Edition

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Python dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Compile Python Backend Sidecar
        run: |
          cd backend
          pyinstaller pyinstaller.spec --noconfirm

      - name: Stage Sidecar Binaries for Tauri
        run: |
          mkdir -p frontend/src-tauri/binaries/labelsort-engine
          cp -r backend/dist/labelsort-engine/* frontend/src-tauri/binaries/labelsort-engine/

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Tauri Desktop Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: './frontend'
          tagName: ${{ github.ref_name }}
          releaseName: 'LabelSort Pro Desktop v__VERSION__'
          releaseBody: 'LabelSort Pro Desktop Edition for Windows. Download the setup file below.'
          releaseDraft: false
          prerelease: false

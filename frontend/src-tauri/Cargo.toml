[package]
name = "labelsort-pro"
version = "1.0.0"
description = "LabelSort Pro Desktop Edition"
edition = "2021"
authors = ["LabelSort Team"]

[lib]
name = "labelsort_pro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
anyhow = "1"
